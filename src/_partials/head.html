  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{page.title}}</title>
  <meta name="description" content="{{#if page.description}}{{page.description}}{{else}}{{site.brand.defaultDescription}}{{/if}}">
  <link rel="canonical" href="{{site.brand.url}}{{page.url}}">

  <!-- Open Graph / Pinterest / social sharing preview -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site.brand.name}}">
  <meta property="og:title" content="{{#if page.ogTitle}}{{page.ogTitle}}{{else}}{{page.title}}{{/if}}">
  <meta property="og:description" content="{{#if page.description}}{{page.description}}{{else}}{{site.brand.defaultDescription}}{{/if}}">
  <meta property="og:url" content="{{site.brand.url}}{{page.url}}">
  <meta property="og:image" content="{{#if page.ogImage}}{{page.ogImage}}{{else}}{{#if page.heroImage}}{{page.heroImage}}{{else}}{{site.brand.defaultOgImage}}{{/if}}{{/if}}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{#if page.ogTitle}}{{page.ogTitle}}{{else}}{{page.title}}{{/if}}">
  <meta name="twitter:description" content="{{#if page.description}}{{page.description}}{{else}}{{site.brand.defaultDescription}}{{/if}}">
  <meta name="twitter:image" content="{{#if page.ogImage}}{{page.ogImage}}{{else}}{{#if page.heroImage}}{{page.heroImage}}{{else}}{{site.brand.defaultOgImage}}{{/if}}{{/if}}">

  <!-- Pinterest: lets people save your images without a scary warning -->
  <meta name="pinterest-rich-pin" content="true">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/css/styles.css">
